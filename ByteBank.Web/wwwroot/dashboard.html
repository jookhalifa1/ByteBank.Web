<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.7/signalr.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            margin: 20px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            background-color: #fff;
            border-radius: 6px;
            overflow: hidden;
        }

        th, td {
            padding: 12px 15px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #3498db;
            color: #fff;
            font-weight: bold;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr.new-transaction {
            background-color: #d4edda; /* light green for new transactions */
            font-weight: bold;
        }

        tr:hover {
            background-color: #f1f7ff;
            transition: background-color 0.2s ease-in-out;
        }

        /* Status colors */
        td.status-success {
            color: #2e7d32;
            font-weight: bold;
        }

        td.status-failed {
            color: #c62828;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Transactions Dashboard</h1>

    <table id="transactionsTable">
        <thead>
            <tr>
                <th>Sender Card</th>
                <th>Receiver Card</th>
                <th>Amount</th>
                <th>Fee</th>
                <th>Total</th>
                <th>Date</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <!-- Transactions will be inserted here -->
        </tbody>
    </table>

    <script>
        const tableBody = document.querySelector("#transactionsTable tbody");

        // JWT token (fixed for testing)
        const token = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJlbWFpbCI6Impvb1NheWVkQGdtYWlsLmNvbSIsIm5hbWUiOiJKb29TYXllZCIsIm5hbWVpZCI6IjY5MjE2NzhkLWQ1MzMtNDA2Mi1hYWY3LTJjNjlmMDNkMzkzZSIsImh0dHA6Ly9zY2hlbWFzLm1pY3Jvc29mdC5jb20vd3MvMjAwOC8wNi9pZGVudGl0eS9jbGFpbXMvcm9sZSI6IkFkbWluIiwiZXhwIjoxNzczMzY5ODM4LCJpc3MiOiJodHRwczovL2xvY2FsaG9zdDo3MTc1IiwiYXVkIjoiaHR0cHM6Ly9sb2NhbGhvc3Q6NzE3NSJ9.ELUmekmuyEz-eDPMX-kXcaVS2S3nwumJ69BFRbutcWk";

        if (!token) {
            tableBody.innerHTML = "<tr><td colspan='7'>Please log in first to see transactions.</td></tr>";
        }

        // Function to add a transaction row
        function addTransactionRow(trans, isNew = false) {
            const tr = document.createElement("tr");
            if (isNew) tr.classList.add("new-transaction");

            const statusClass = trans.status ? "status-success" : "status-failed";

            tr.innerHTML = `
                    <td>${trans.senderCard}</td>
                    <td>${trans.reciverCard}</td>
                    <td>${trans.amount}</td>
                    <td>${trans.fee}</td>
                    <td>${trans.total}</td>
                    <td>${new Date(trans.dateOfTransaction).toLocaleString()}</td>
                    <td class="${statusClass}">${trans.status ? 'Success' : 'Failed'}</td>
                `;
            tableBody.appendChild(tr);
        }

        // 1️⃣ Load old transactions from API
        async function loadOldTransactions() {
            try {
                const response = await fetch('https://localhost:7175/api/Transaction', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                if (!data || data.length === 0) {
                    tableBody.innerHTML = "<tr><td colspan='7'>No transactions found.</td></tr>";
                    return;
                }

                data.forEach(trans => addTransactionRow(trans));

            } catch (err) {
                console.error("Failed to fetch old transactions:", err);
                tableBody.innerHTML = `<tr><td colspan='7'>Error fetching transactions: ${err.message}</td></tr>`;
            }
        }

        loadOldTransactions();

        // 2️⃣ SignalR connection
        const connection = new signalR.HubConnectionBuilder()
            .withUrl("/transactionHub", { accessTokenFactory: () => token })
            .configureLogging(signalR.LogLevel.Information)
            .build();

        // Listen for new transactions
        connection.on("NewTransaction", function (trans) {
            addTransactionRow(trans, true);
        });

        // Start SignalR connection
        connection.start()
            .then(() => {
                console.log("Connected to SignalR Hub");

                // Automatically join group based on bankId from server or default
                const bankId = "1"; // Replace with actual bankId from user if available
                connection.invoke("JoinGroup", bankId)
                    .catch(err => console.error("JoinGroup error:", err));
            })
            .catch(err => console.error("Failed to connect to SignalR Hub:", err));
    </script>
</body>
</html>
