<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Verify OTP</title>

    <style>
        body {
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f5f5f5;
        }

        .otp-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            text-align: center;
        }

        input {
            padding: 10px;
            font-size: 16px;
            width: 150px;
            text-align: center;
        }

        button {
            padding: 10px 20px;
            margin-top: 10px;
            cursor: pointer;
        }

        .error {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="otp-container">
        <h2>Enter OTP</h2>
        <input type="text" id="otpInput" placeholder="Enter code" maxlength="6">
        <br>
        <button id="verifyBtn">Verify</button>
        <div class="error" id="errorMsg"></div>
    </div>

    <script>
        
        const params = new URLSearchParams(window.location.search);
        const email = params.get("email");

        console.log("Email from URL:", email);

        const otpInput = document.getElementById("otpInput");
        const verifyBtn = document.getElementById("verifyBtn");
        const errorMsg = document.getElementById("errorMsg");

        verifyBtn.addEventListener("click", async () => {

            const code = otpInput.value.trim();

            if (!email) {
                errorMsg.textContent = "Email missing ";
                return;
            }

            if (code === "") {
                errorMsg.textContent = "Please enter the OTP";
                return;
            }

            try {
                const response = await fetch("https://localhost:7175/api/Authentication/VerifyOTP", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        code: code
                    })
                });

                const data = await response.json();
                console.log("Response:", data);

                if (response.ok) {
                    localStorage.setItem("Token", data.token);
                    alert("OTP Verified!");
                    window.location.href = "dashboard.html";
                } else {
                    errorMsg.textContent = data.message || "Invalid OTP!";
                }

            } catch (err) {
                errorMsg.textContent = "Server error. Try again!";
                console.error(err);
            }
        });
    </script>

</body>
</html>
